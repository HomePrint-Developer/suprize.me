<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semoga Bermanfaat — Suprize.me</title>

    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Load Google Font: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top, #fff7ed 0%, #f9fafb 60%);
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .animate-float {
            animation: float 3.5s ease-in-out infinite;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-5 antialiased text-gray-800">

    <!-- Container Card Utama -->
    <div
        class="bg-white/95 backdrop-blur-sm rounded-3xl shadow-[0_12px_40px_rgb(0,0,0,0.06)] p-8 sm:p-10 max-w-md w-full text-center border border-orange-100/80 transition-all duration-300 hover:shadow-[0_16px_45px_rgb(238,77,45,0.08)]">

        <!-- Ikon Kado / Hadiah dengan animasi halus -->
        <div
            class="animate-float mx-auto mb-6 inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-orange-50 to-orange-100/80 text-[#ee4d2d] shadow-inner">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"
                    d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" />
            </svg>
        </div>

        <!-- Judul Utama -->
        <h1 class="text-2xl font-bold text-gray-900 tracking-tight mb-3">
            Semoga Bermanfaat!
        </h1>

        <!-- Pesan Utama -->
        <p class="text-gray-600 text-[0.98rem] leading-relaxed mb-6">
            Ini barangnya! Di bawah ini link Shopee-nya ya, semoga bermanfaat dan suka.
        </p>

        <!-- Badge Pengirim -->
        <div class="mb-8">
            <span
                class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-orange-50 text-[#ee4d2d] border border-orange-100">
                <span class="w-1.5 h-1.5 rounded-full bg-[#ee4d2d]"></span>
                Dari : Anak TI
            </span>
        </div>

        <!-- Tombol Link Shopee -->
        <a href="https://id.shp.ee/ToeX5Cw2" target="_blank" rel="noopener noreferrer"
            class="group relative inline-flex items-center justify-center w-full bg-[#ee4d2d] hover:bg-[#d73f22] active:scale-[0.99] text-white font-semibold py-3.5 px-6 rounded-xl shadow-[0_6px_20px_rgba(238,77,45,0.28)] hover:shadow-[0_8px_25px_rgba(238,77,45,0.38)] transition-all duration-200 transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#ee4d2d]">
            <span>Link Shopee</span>

            <!-- Ikon Panah -->
            <svg xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 ml-2 transition-transform duration-200 group-hover:translate-x-1" viewBox="0 0 20 20"
                fill="currentColor">
                <path fill-rule="evenodd"
                    d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
                    clip-rule="evenodd" />
            </svg>
        </a>

    </div>

</body>

</html>
